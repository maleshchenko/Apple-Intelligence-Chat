name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    env:
      SCHEME: "Apple Intelligence Chat"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -quiet

      - name: Boot simulator
        run: |
          # Pick the first available iPhone on the latest iOS runtime
          SIM_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtimes = sorted([r for r in data['devices'] if 'iOS' in r], reverse=True)
          for rt in runtimes:
              for d in data['devices'][rt]:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      exit()
          ")
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          echo "Booted simulator: $SIM_ID"

      - name: Run tests
        run: |
          TESTRUN=$(find DerivedData/Build/Products -name "*.xctestrun" | head -1)
          xcodebuild test-without-building \
            -xctestrun "$TESTRUN" \
            -destination "id=$SIM_ID"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DerivedData/Logs/Test/*.xcresult
          retention-days: 7
